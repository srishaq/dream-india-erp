<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#140C59">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dream India Realty">
<title>HR &amp; Admin · Dream India Realty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal.css">
<style>
/* HR & Admin. Same look as the Users page (portal.css), with section tabs and a side panel for one employee. */
main{grid-template-columns:minmax(0,1fr)}
#view,#view>*{min-width:0}
.letter{overflow-wrap:anywhere}
.seg{display:flex;gap:4px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:#FBE4E1;color:var(--risk);font-size:12px}
.seg button[aria-pressed="true"] .n{background:#fff}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.figs div{padding:14px 16px;box-shadow:0 0 0 .5px var(--line)}
.figs b{display:block;font-size:24px;letter-spacing:-.01em}
.figs span{font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0}
.tools .field{min-width:160px}
.tools .grow{flex:1 1 220px}
.field textarea{padding:10px 11px;border:1px solid #C3CAC4;border-radius:8px;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;font-weight:400;resize:vertical;line-height:1.5}
.num{text-align:right;white-space:nowrap}
.field select,.field input{min-width:0;width:100%}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F7F8F5}
.muted{color:var(--muted)}
.tag.ok{background:#E3F1EC;color:var(--in)} .tag.wait{background:#FFF4DC;color:#8A5A00} .tag.left{background:#EEF0EC;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
/* side panel */
.scrim{position:fixed;inset:0;background:rgba(20,12,89,.4);z-index:40;display:flex;justify-content:flex-end}
.side{background:var(--paper);width:min(860px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.side .hd{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.side .hd h2{margin:0;font-size:18px;flex:1;min-width:0}
.side .hd .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.side .bd{padding:18px 20px 60px;display:grid;gap:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.box h3{margin:0;font-size:15.5px;display:flex;align-items:center;gap:8px}
.box h3 .lock{margin-left:auto;font-weight:500}
.grid.tight{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.chk input{width:17px;height:17px;accent-color:var(--ink)}
.docs{display:grid;gap:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid #EDF0EB;border-radius:10px;padding:8px 10px;font-size:14px}
.doc .t{font-weight:600}
.doc .m{color:var(--muted);font-size:12.5px}
.doc .grow{flex:1;min-width:0}
.doc .ic{width:34px;height:34px;border-radius:8px;background:#E3ECF5;color:#2B5C8A;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.need{display:flex;flex-wrap:wrap;gap:6px}
.need span{font-size:12.5px;padding:3px 10px;border-radius:99px;background:#FFF4DC;color:#8A5A00}
.need span.have{background:#E3F1EC;color:var(--in)}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prog{height:6px;background:#EDF0EB;border-radius:99px;overflow:hidden;flex:1;min-width:80px}
.prog i{display:block;height:100%;background:var(--ink);width:0}
/* policies */
.pols{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:800px){.pols{grid-template-columns:1fr}}
.plist{display:grid;gap:6px}
.plist button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.plist button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.plist small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.doctext{font-size:15px;line-height:1.6;max-width:72ch}
.doctext h4{font-size:16px;margin:18px 0 6px}
.doctext h4:first-child{margin-top:0}
.doctext ul{margin:4px 0 10px;padding-left:22px}
.doctext p{margin:0 0 10px}
.draftnote{background:#FFF4DC;border-radius:10px;padding:10px 12px;font-size:13.5px;color:#6B4800}
.letter{white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.55;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px 32px;min-height:300px}
.letter mark{background:#FFE7A3;padding:0 2px}
@media (max-width:640px){.side .bd{padding:14px 12px 48px}.letter{padding:18px}}
</style>
</head>
<body>
<header><div class="bar"><img src="/logo.svg" alt="Dream India Realty" width="123" height="32"><div class="title"><small>Dream India Realty</small><b>HR &amp; Admin</b></div><div id="mods"></div><div class="end" id="user"></div></div></header>
<main hidden id="main">
  <div class="seg" role="group" aria-label="HR sections" id="tabs"></div>
  <div class="err" id="err" role="alert"></div>
  <section id="view"></section>
</main>
<script src="/pshell.js"></script>
<script src="/hr-excel.js"></script>
<script src="/page-hr.js"></script>
</body>
</html>
