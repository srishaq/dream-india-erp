<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E0F13">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>AI Agent Team · Dream India Realty</title>
<style>
:root{
  --bg:#0E0F13;--bg2:#15171D;--panel:#1A1C23;--panel2:#20232B;--line:#2C303A;--ink:#F2F0EA;--mut:#9BA0AB;--dim:#5E6370;
  --amber:#F5A524;--amber2:#FF7A1A;--glow:rgba(245,165,36,.35);--green:#3DDC84;--red:#FF5A5F;--violet:#8B7CF6;--cyan:#38BDF8;
  --display:"Bahnschrift","DIN Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1400px 500px at 70% -10%,#2A1C08 0,transparent 60%),radial-gradient(900px 400px at 0% 110%,#1B1430 0,transparent 60%),var(--bg);min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--amber)}
.boot{padding:60px;text-align:center;color:var(--mut)}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:rgba(14,15,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pick{display:flex;align-items:center;gap:8px}
.pick label{font:700 11px/1 var(--mono);letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
.pick select{background:var(--panel2);border:1px solid var(--amber);border-radius:10px;padding:9px 34px 9px 12px;font-weight:700;font-size:15px;min-width:240px;box-shadow:0 0 0 3px rgba(245,165,36,.12);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--amber) 50%),linear-gradient(135deg,var(--amber) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.title{flex:1 1 360px;min-width:0;font:800 26px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title b{color:var(--amber);font-weight:800}
.live{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green);padding:8px 12px;border:1px solid #1E5A3A;border-radius:999px;background:#0F2418}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s infinite}
.live.off{color:var(--red);border-color:#5A1E22;background:#24100F}.live.off i{background:var(--red);box-shadow:0 0 10px var(--red)}
@keyframes pulse{50%{opacity:.35}}
.clock{font:700 13px var(--mono);color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:linear-gradient(180deg,var(--amber),var(--amber2));color:#1A1206;border-color:transparent;font-weight:700}
.btn.danger{border-color:#6A2427;color:#FFB4B6}.btn.danger[aria-pressed=true]{background:var(--red);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{color:var(--mut);text-decoration:none;font-weight:600;font-size:13px}

.banner{margin:14px 20px 0;padding:10px 14px;border-radius:10px;border:1px solid #6B4A0E;background:#2A1E08;color:#FFD99A;font-size:13.5px}
.banner.red{border-color:#6A2427;background:#2A1012;color:#FFC2C4}

/* the board */
.board{display:grid;gap:14px;padding:16px 20px 20px;grid-template-columns:minmax(250px,1fr) minmax(250px,1fr) minmax(480px,2.1fr) minmax(250px,1fr)}
.col{display:grid;gap:14px;align-content:start;position:relative}
.col:not(:last-child)::after{content:"";position:absolute;right:-12px;top:60px;width:10px;height:2px;background:linear-gradient(90deg,var(--amber),transparent)}
.p{position:relative;background:linear-gradient(180deg,var(--panel),#16181E);border:1px solid #3A2E18;border-radius:14px;padding:12px 13px 13px;box-shadow:0 0 0 1px rgba(245,165,36,.08),0 0 18px -6px var(--glow)}
.p.dash{border-style:dashed;border-color:#245A6A;box-shadow:0 0 18px -8px rgba(56,189,248,.35)}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.ph .n{font:700 11px var(--mono);color:var(--dim)}
.ph h3{margin:0;font:800 16px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.ph .st{margin-left:auto;font:700 10px/1 var(--mono);letter-spacing:.08em;padding:4px 6px;border-radius:5px;background:#3A2A0C;color:var(--amber);text-transform:uppercase}
.ph .st.ok{background:#0F2C1B;color:var(--green)}.ph .st.no{background:#2A2C33;color:var(--mut)}
.sub{color:var(--mut);font-size:12px;margin:0 0 9px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.tile{display:grid;justify-items:center;gap:4px;text-align:center;font-size:10.5px;line-height:1.15;color:var(--mut)}
.tile .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:800 11px var(--mono);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tile.off .ic{filter:grayscale(1) brightness(.45)}.tile.off{color:var(--dim)}
.tile.off .ic::after{content:"";position:absolute}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.step b{display:block;font-size:13px}.step b::after{content:" ✓";color:var(--green)}.step.off b::after{content:" ·";color:var(--dim)}
.step span{font:11px var(--mono);color:var(--mut)}
.step.hot{border-color:var(--amber);background:#2A1E0A}
.note{font-size:12px;color:var(--mut);margin-top:9px}
.files{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.file{all:unset;cursor:pointer;display:block;background:#1C2A30;border:1px solid #24414B;border-radius:8px;padding:7px 8px;min-width:0}
.file:hover{border-color:var(--cyan)}
.file b{display:block;font:700 12px var(--mono);color:#9FE3FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file.own{border-color:#8A6216;background:#2A1F0B}.file.own b{color:var(--amber)}
.access{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.acc{all:unset;cursor:pointer;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 4px;font-size:11.5px;font-weight:600;position:relative}
.acc:hover{border-color:var(--amber)}
.acc em{position:absolute;top:-6px;right:-5px;font-style:normal;background:var(--violet);color:#fff;border-radius:999px;font:700 10px/1 var(--mono);padding:3px 5px}
.acc.kill{color:#FFB4B6;border-color:#5A2427}
.owner{display:grid;gap:6px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.kv span{color:var(--mut)}.kv b{text-align:right;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font:700 10px var(--mono);letter-spacing:.08em;padding:3px 6px;border-radius:5px;background:#2C2450;color:#C9C0FF;text-transform:uppercase}

.depts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dept{cursor:pointer;background:linear-gradient(180deg,#1E2027,#181A20);border:1px solid #4A3A1C;border-radius:12px;padding:10px 11px;transition:border-color .15s}
.dept:hover,.dept[aria-pressed=true]{border-color:var(--amber);box-shadow:0 0 16px -6px var(--glow)}
.dept .ph h3{font-size:14px}
.dept .tiles{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:6px 0 8px}
.dept .tile .ic{width:28px;height:28px;font-size:10px;border-radius:7px}
.dept .tile{font-size:9.5px}
.line{display:flex;gap:6px;align-items:flex-start;font:11.5px/1.35 var(--mono);color:#E9D6B0;min-height:30px}
.line::before{content:"↻";color:var(--amber);animation:spin 2.4s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:4px;border-radius:9px;background:#2A2D35;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7CF0B0)}

.trig{display:grid;gap:6px}
.tr{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12.5px}
.tr i{width:9px;height:9px;border-radius:50%;background:#3A3E48;flex:none}
.tr.on i{background:var(--green);box-shadow:0 0 8px var(--green)}
.tr.hot{border-color:var(--amber);background:#2A1E0A}.tr.hot i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tr.owner i{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.tr.na{color:var(--dim)}
.tr small{margin-left:auto;font:11px var(--mono);color:var(--mut);white-space:nowrap}

/* bottom row */
.lower{display:grid;gap:14px;padding:0 20px 14px;grid-template-columns:2fr 1.2fr 1.3fr}
.focus .voice{background:linear-gradient(90deg,#3B2F86,#5A45C7);color:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;margin:6px 0 10px}
.feed{display:grid;gap:7px;max-height:440px;overflow:auto;padding-right:4px}
.ev{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.ev.owner{border-color:#5A45C7;background:#211C3A}
.ev.brief{border-color:#6B4A0E}
.ev.draft{border-color:#1E5A3A}
.ev .h{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:2px}
.ev .h b{color:var(--ink)}
.ev .h .dot{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font:800 8.5px var(--mono);color:#fff}
.ev .h time{margin-left:auto;font:11px var(--mono)}
.ev p{margin:0;font-size:13px}
.term{background:#07090B;border:1px solid #1C2A22;border-radius:12px;padding:10px 12px;font:12px/1.55 var(--mono);color:#7CF0B0;max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .d{color:#4B6B58}.term .w{color:var(--amber)}.term .k{color:#C9C0FF}
.term .hd{display:flex;gap:6px;align-items:center;color:#4B6B58;margin-bottom:6px}.term .hd i{width:9px;height:9px;border-radius:50%;display:inline-block}
.queue{display:grid;gap:8px;max-height:460px;overflow:auto}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.q h4{margin:0 0 3px;font-size:13.5px}
.q .meta{font:11px var(--mono);color:var(--mut);margin-bottom:5px}
.q p{margin:0 0 7px;font-size:12.5px;color:#D7D3CA;white-space:pre-wrap;max-height:84px;overflow:hidden}
.q .acts{display:flex;gap:6px;flex-wrap:wrap}
.om{background:#211C3A;border:1px solid #3E338A;border-radius:10px;padding:8px 10px;font-size:12.5px}
.om .acts{margin-top:6px}
.empty{color:var(--dim);font-size:12.5px;padding:8px 2px}

.counters{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:0 20px 28px}
.ct{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ct b{display:block;font:800 26px/1 var(--display);color:var(--ink)}
.ct span{font:700 10px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.ct.hl{border-color:#5A45C7}.ct.hl b{color:#C9C0FF}
.loop{text-align:center;font:700 11px var(--mono);letter-spacing:.2em;color:#E8618C;padding:0 0 26px;text-transform:uppercase}

/* dialogs */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--amber);border-radius:14px;padding:0;width:min(760px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,6,8,.7)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:800 18px var(--display);text-transform:uppercase;letter-spacing:.03em;flex:1}
.db{padding:14px 16px;display:grid;gap:12px;max-height:70vh;overflow:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.fld{display:grid;gap:5px}.fld label{font-weight:600;font-size:13px}.fld small{color:var(--mut);font-size:12px}
.fld input,.fld select,.fld textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.fld textarea.big{min-height:340px;font:13px/1.5 var(--mono)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1}.seg button[aria-pressed=true]{border-color:var(--amber);background:#2A1E0A;color:var(--amber)}
.fn{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;background:var(--bg2)}
.fn .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fn .t b{font:800 16px var(--mono);color:var(--amber)}
.pill{font:700 10.5px var(--mono);padding:3px 7px;border-radius:999px;background:#2A2D35;color:var(--mut);text-transform:uppercase}
.pill.on{background:#0F2C1B;color:var(--green)}.pill.live{background:#3A2A0C;color:var(--amber)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#F2F0EA;color:#111;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.err{background:var(--red);color:#fff}

@media (max-width:1500px){.board{grid-template-columns:1fr 1fr 2fr}.board .col:nth-child(4){grid-column:1/-1;grid-template-columns:1fr 1fr}.counters{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1100px){.board{grid-template-columns:1fr 1fr}.board .col:nth-child(3){grid-column:1/-1;order:-1}.lower{grid-template-columns:1fr}.col::after{display:none}}
@media (max-width:700px){.top{padding:10px 16px}.title{font-size:19px;flex-basis:100%;order:3;white-space:normal}.pick{flex:1 1 100%}.pick select{flex:1;min-width:0}
  .board,.lower{padding-left:16px;padding-right:16px}.board{grid-template-columns:1fr}.board .col:nth-child(4){grid-template-columns:1fr}.depts{grid-template-columns:1fr}.counters{grid-template-columns:repeat(2,1fr);padding:0 16px 24px}.row2{grid-template-columns:1fr}.banner{margin:12px 16px 0}.steps{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="boot">Starting the agent team…</div></div>
<script src="/agents.js"></script>
</body>
</html>
