<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>Pre-sales & Sales · Dream India Realty</title>
<style>
:root{--ink:#1d1b19;--mut:#77706a;--line:#e7e1d8;--bg:#faf8f4;--card:#fff;--maroon:#5B151A;--gold:#B8914F;--good:#1d6b33;--warn:#B54708;--bad:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header a.home{color:var(--mut);text-decoration:none;font-size:14px}
h1{font-size:18px;margin:0 10px 0 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.on,.btn.pri{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn:disabled{opacity:.5;cursor:default}
select,input,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);max-width:100%}
main{padding:14px 16px 60px;max-width:1100px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:0 0 14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tabs .btn small{opacity:.75;margin-left:4px}
.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.row:hover{border-color:#cdbfae}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px}
.who .s{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:99px;background:#f3ece2;color:var(--maroon);margin-right:4px}
.chip.good{background:#e7f4ea;color:var(--good)}.chip.warn{background:#fdf1e3;color:var(--warn)}.chip.bad{background:#fde8e6;color:var(--bad)}
.right{text-align:right;font-size:12.5px;color:var(--mut);white-space:nowrap}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.panel{position:fixed;inset:0;background:rgba(20,16,12,.35);z-index:10;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:16px 16px 40px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.sheet h2{margin:0;font-size:20px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.box h3{margin:0 0 8px;font-size:14px;color:var(--maroon)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label,.f label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.grid2 select,.grid2 input,.f textarea,.f input,.f select{width:100%}
.outs{display:flex;flex-wrap:wrap;gap:6px}
.outs .btn{font-size:13px;padding:6px 10px}
.f{margin:8px 0 0}
.ev{border-left:3px solid var(--line);padding:2px 0 8px 10px;margin:0 0 6px;font-size:13.5px}
.ev .t{color:var(--mut);font-size:12px}
.calls a{font-size:13px}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1b19;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:20}
.src{width:100%;border-collapse:collapse;font-size:13px}.src td{padding:3px 6px;border-top:1px solid var(--line)}.src td:not(:first-child){text-align:right}
@media (max-width:560px){.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px}.stat b{font-size:18px}.stat span{font-size:11.5px}.grid2{grid-template-columns:1fr}header{padding:8px 12px}main{padding:12px 10px 60px}}
</style>
</head>
<body>
<header>
  <a class="home" href="/">← Home</a>
  <h1>Pre-sales &amp; Sales</h1>
  <select id="proj" aria-label="Project"></select>
  <input id="q" type="search" placeholder="Search name or number" style="flex:1;min-width:160px">
  <button class="btn pri" id="add">+ Add a lead</button>
</header>
<main>
  <div id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script src="/leads.js"></script>
</body>
</html>
