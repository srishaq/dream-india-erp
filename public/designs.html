<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>All designs · Dream India Realty</title>
<style>
:root{--ink:#1d1b19;--mut:#77706a;--line:#e7e1d8;--bg:#faf8f4;--card:#fff;--maroon:#5B151A;--gold:#B8914F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn.pri{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn:disabled{opacity:.5;cursor:default}
.sum{color:var(--mut);font-size:13px;margin-left:auto}
main{padding:16px;max-width:1500px;margin:0 auto}
.week{margin:18px 0 6px;font-weight:700;color:var(--maroon);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.imgs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#111}
.imgs a{flex:0 0 100%;scroll-snap-align:start}
.imgs img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
.noimg{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:#aaa;background:#f1ede6;font-size:13px}
.meta{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.t{font-weight:600;font-size:14px}
.s{color:var(--mut);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:#f3ece2;color:var(--maroon)}
.tag.ok{background:#e7f4ea;color:#1d6b33}
.acts{display:flex;gap:6px;margin-top:6px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.sum{margin-left:0;width:100%}}
</style>
</head>
<body>
<header>
  <h1>All designs</h1>
  <span id="streams"></span>
  <span id="states"></span>
  <a class="btn" href="/agents">← AI Agent Team</a>
  <span class="sum" id="sum"></span>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script src="/designs.js"></script>
</body>
</html>
