<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#140C59">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>Approve purchase request · Dream India ERP</title>
<style>
:root{--ink:#140C59;--muted:#5E6A72;--line:#DDE1DB;--bg:#F4F5F1;--ok:#17663A;--okbg:#E2F4E8;--bad:#B42318;--badbg:#FBE4E1}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 16px calc(14px) 16px;display:flex;align-items:center;gap:10px}
header img{width:28px;height:28px}
header b{font-size:15px}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
h1{margin:0;font-size:22px;line-height:1.2}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
dt{color:var(--muted)}dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.items{width:100%;border-collapse:collapse;font-size:15px}
.items td{padding:6px 0;border-bottom:1px solid var(--line)}.items td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.budget{padding:12px 14px;border-radius:10px;font-weight:600;font-size:14.5px}
.budget.ok{background:var(--okbg);color:var(--ok)}.budget.over{background:var(--badbg);color:var(--bad)}.budget.none{background:#EEF0EC;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border-radius:999px;padding:15px 12px;border:0;cursor:pointer;font-size:17px}
button:disabled{opacity:.55;cursor:default}
.yes{background:var(--ok);color:#fff}.no{background:#fff;color:var(--bad);border:2px solid var(--bad)}
textarea{width:100%;font:inherit;font-size:16px;border:1px solid #C3CAC4;border-radius:10px;padding:10px 12px;min-height:80px;resize:vertical}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
.err{color:var(--bad);font-weight:600;min-height:1em}
.done{text-align:center;padding:26px 10px;display:grid;gap:8px}
.done .big{font-size:44px;line-height:1}
.done.ok{color:var(--ok)}.done.no{color:var(--bad)}
.muted{color:var(--muted);font-size:14px}
a{color:var(--ink)}
</style>
</head>
<body>
<header><img src="/icon.svg" alt=""><b>Dream India ERP · Purchase approval</b></header>
<main><div class="card" id="app"><p class="muted">Loading…</p></div></main>
<script src="/approve.js"></script>
</body>
</html>
